<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Selena Ghane</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: 'EB Garamond', 'Times New Roman', Times, serif;
      font-size: 19px;
      margin: 0;
      background: #05123b;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      padding: 25px;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .logo {
      font-size: 25px;
      letter-spacing: 1px;
      color: #ffffff;
      text-decoration: none;
      justify-self: start;
    }

    nav {
      display: flex;
      gap: 32px;
      justify-self: center;
    }

    nav a {
      color: #ffffff;
      text-decoration: none;
      font-size: 18px;
      letter-spacing: 0.5px;
      position: relative;
      padding-bottom: 4px;
    }

    nav a::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 1px;
      background: #ffffff;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.25s ease;
    }

    nav a:hover::after {
      transform: scaleX(1);
    }

    main {
      flex: 1;
    }

    @media (max-width: 600px) {
      header {
        grid-template-columns: 1fr;
        justify-items: center;
        text-align: center;
      }

      nav {
        gap: 18px;
      }
    }
  </style>
</head>

<body>
  <header>
    <a class="logo" href="#">Selena Ghane</a>
    <nav>
      <a href="#">about</a>
      <a href="#">projects</a>
      <a href="#">writing</a>
      <a href="#">contact</a>
    </nav>
  </header>

  <main></main>
</body>

</html>
